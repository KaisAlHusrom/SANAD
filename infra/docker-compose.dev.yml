# Sanad dev stack (OPS2): mirrors staging/prod topology and hot-reloads.
# Published host ports are offset into a Sanad-only block so they never collide with
# other projects' containers; internal container ports stay standard. All overridable.
#
# From P2 the JWT keypair must be supplied (identity fails fast without it, U19), so
# pass a dev env file that carries it (committed throwaway in infra/.env.example; the
# gitignored infra/.env.development also has it from 2026-06-24):
#
#   docker compose --env-file infra/.env.development -f infra/docker-compose.dev.yml up -d --build
#   curl http://localhost:${NGINX_PORT:-8190}/api/health
#   curl -X POST http://localhost:${NGINX_PORT:-8190}/api/auth/login \
#        -H 'content-type: application/json' \
#        -d '{"email":"admin@sanad.tech","password":"change-me-admin"}'
#
# Nx isolation (per app container): each app gets its OWN `.nx` volume (masking the
# bind-mounted one) + NX_DAEMON=false, so concurrent nx processes (host vs container,
# or two containers starting at once) never collide on shared `.nx` state — which used
# to crash a container with "Recursive task invocation detected".
name: sanad-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanad}
      POSTGRES_DB: ${POSTGRES_DB:-sanad}
    ports:
      - '${POSTGRES_PORT:-5440}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-sanad} -d ${POSTGRES_DB:-sanad}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sanad-dev-net

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6390}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sanad-dev-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sanad}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sanad}
    ports:
      - '${RABBITMQ_PORT:-5680}:5672'
      - '${RABBITMQ_MGMT_PORT:-15680}:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sanad-dev-net

  api-gateway:
    build:
      context: ..
      dockerfile: infra/docker/api-gateway.dev.Dockerfile
    environment:
      NODE_ENV: development
      APP_ENV: development
      # Isolate Nx per container (own .nx volume below) + no daemon, so concurrent nx
      # processes never collide on shared state (the "recursive task invocation" crash).
      NX_DAEMON: 'false'
      PORT: 3000
      HOST: 0.0.0.0
      # Connection strings the gateway/services consume from P2 onward.
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
      # The gateway holds only the JWT PUBLIC key — it verifies, identity signs (decision 2).
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    volumes:
      # Bind-mount the whole workspace for hot-reload; keep container-built node_modules + .nx.
      - ..:/workspace
      - gateway_node_modules:/workspace/node_modules
      - gateway_nx:/workspace/.nx
    ports:
      - '${GATEWAY_PORT:-3010}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
      settings-service:
        condition: service_started
      media-service:
        condition: service_started
      content-service:
        condition: service_started
      notifications-service:
        condition: service_started
    networks:
      - sanad-dev-net

  identity-service:
    build:
      context: ..
      dockerfile: infra/docker/identity-service.dev.Dockerfile
    environment:
      NODE_ENV: development
      APP_ENV: development
      NX_DAEMON: 'false'
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD:-sanad}@postgres:5432/identity
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
      # RS256 keypair (dev throwaway in infra/.env.example) — identity signs + verifies.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sanad.tech}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
    volumes:
      - ..:/workspace
      - identity_node_modules:/workspace/node_modules
      - identity_nx:/workspace/.nx
    ports:
      - '${IDENTITY_PORT:-3011}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sanad-dev-net

  settings-service:
    build:
      context: ..
      dockerfile: infra/docker/settings-service.dev.Dockerfile
    environment:
      NODE_ENV: development
      APP_ENV: development
      NX_DAEMON: 'false'
      PORT: 3002
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD:-sanad}@postgres:5432/settings
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      # AES-256-GCM master key for the integration-secrets vault (N13). Dev throwaway here;
      # a real base64-32-byte key is REQUIRED in staging/prod (OPS1).
      APP_SECRETS_ENCRYPTION_KEY: ${APP_SECRETS_ENCRYPTION_KEY:-c2FuYWQtZGV2LXNlY3JldHMtZW5jcnlwdGlvbi1rZXk=}
      # Env fallback for the SMTP password secret (the vault is the primary source).
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ..:/workspace
      - settings_node_modules:/workspace/node_modules
      - settings_nx:/workspace/.nx
    ports:
      - '${SETTINGS_PORT:-3012}:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sanad-dev-net

  media-service:
    build:
      context: ..
      dockerfile: infra/docker/media-service.dev.Dockerfile
    environment:
      NODE_ENV: development
      APP_ENV: development
      NX_DAEMON: 'false'
      PORT: 3003
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD:-sanad}@postgres:5432/media
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
      # Cloudflare R2 (S3-compatible). OPTIONAL — the service boots without them and
      # uploads 503 until set. Real values live in gitignored infra/.env.development
      # (the integration-secrets vault replaces this env source later — see PROGRESS).
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    volumes:
      - ..:/workspace
      - media_node_modules:/workspace/node_modules
      - media_nx:/workspace/.nx
    ports:
      - '${MEDIA_PORT:-3013}:3003'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sanad-dev-net

  content-service:
    build:
      context: ..
      dockerfile: infra/docker/content-service.dev.Dockerfile
    environment:
      NODE_ENV: development
      APP_ENV: development
      NX_DAEMON: 'false'
      PORT: 3004
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD:-sanad}@postgres:5432/content
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
    volumes:
      - ..:/workspace
      - content_node_modules:/workspace/node_modules
      - content_nx:/workspace/.nx
    ports:
      - '${CONTENT_PORT:-3014}:3004'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sanad-dev-net

  notifications-service:
    build:
      context: ..
      dockerfile: infra/docker/notifications-service.dev.Dockerfile
    environment:
      NODE_ENV: development
      APP_ENV: development
      NX_DAEMON: 'false'
      PORT: 3005
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD:-sanad}@postgres:5432/notifications
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
      # SMTP transport — OPTIONAL: unset → emails are logged to the console (dev-safe). The
      # SMTP PASSWORD is resolved from the settings-secrets vault (N13); SMTP_PASSWORD here
      # is the env fallback. NOTIFICATIONS_TEAM_EMAIL receives new-lead alerts.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-Sanad Tech <no-reply@sanad.tech>}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATIONS_TEAM_EMAIL: ${NOTIFICATIONS_TEAM_EMAIL:-team@sanad.tech}
    volumes:
      - ..:/workspace
      - notifications_node_modules:/workspace/node_modules
      - notifications_nx:/workspace/.nx
    ports:
      - '${NOTIFICATIONS_PORT:-3015}:3005'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sanad-dev-net

  # First frontend (P7): the Vite admin portal dev server, served under /admin/ by
  # nginx. The browser calls the gateway at the relative /api (resolved against the
  # nginx origin), so this container needs no DB/broker — it only serves the SPA.
  admin-portal:
    build:
      context: ..
      dockerfile: infra/docker/admin-portal.dev.Dockerfile
    environment:
      NODE_ENV: development
      APP_ENV: development
      VITE_APP_ENV: development
      NX_DAEMON: 'false'
    volumes:
      - ..:/workspace
      - admin_node_modules:/workspace/node_modules
      - admin_nx:/workspace/.nx
    ports:
      - '${ADMIN_PORT:-4200}:4200'
    networks:
      - sanad-dev-net

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${NGINX_PORT:-8190}:80'
    depends_on:
      - api-gateway
      - admin-portal
    networks:
      - sanad-dev-net

networks:
  sanad-dev-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  gateway_node_modules:
  identity_node_modules:
  settings_node_modules:
  media_node_modules:
  content_node_modules:
  notifications_node_modules:
  admin_node_modules:
  # Per-container Nx state (masks the bind-mounted .nx so nx processes don't share state).
  gateway_nx:
  identity_nx:
  settings_nx:
  media_nx:
  content_nx:
  notifications_nx:
  admin_nx:
