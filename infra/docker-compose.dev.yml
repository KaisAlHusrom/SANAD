# Sanad dev stack (OPS2): mirrors staging/prod topology and hot-reloads.
# Published host ports are offset into a Sanad-only block so they never collide with
# other projects' containers; internal container ports stay standard. All overridable.
#
# Launch it the one right way (asserts the env file, sequences the boot, waits for health):
#
#   infra/scripts/dev-up.sh          # up + wait for /api/health
#   infra/scripts/dev-health.sh      # read-only health snapshot
#   infra/scripts/dev-down.sh        # stop (keeps data; add -v to wipe)
#
# (Equivalent raw command, if you prefer:
#   docker compose --env-file infra/.env.development -f infra/docker-compose.dev.yml up -d --build)
# infra/.env.development carries the RS256 JWT keypair + APP_SECRETS_ENCRYPTION_KEY; without
# it the gateway + identity fail fast at boot (U19). There is no auto-loaded infra/.env.
#
# ── Durable dev-runtime design (why this file looks the way it does) ──────────────────────
# The backend containers do NOT run `nx serve`. Each runs infra/scripts/dev-entry.sh →
# SWC compile + a chokidar supervisor (infra/scripts/dev-serve.mjs) that ALWAYS restarts the
# node process on a crash and on shared-lib dist changes. This kills two chronic failures:
#   * Nx "Recursive task invocation (serve -> serve)" — Nx no longer runs in app containers.
#   * `node --watch` staying dead after a non-zero crash ("Failed running 'dist/main.js'").
# The shared libs/*/dist is built ONCE by the `libs-builder` service (its SOLE writer), so a
# service (re)start never rebuilds the shared dist → no more cross-service cascade / half-write
# (`ERR_MODULE_NOT_FOUND`). Every app container has a liveness healthcheck + `restart:
# unless-stopped`, so a crash is transient, never permanent. (Only the two frontends still run
# Nx — for the Vite/Next dev plugins — so they keep NX_DAEMON=false + an isolated .nx volume.)
name: sanad-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanad}
      POSTGRES_DB: ${POSTGRES_DB:-sanad}
    ports:
      - '${POSTGRES_PORT:-5440}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-sanad} -d ${POSTGRES_DB:-sanad}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sanad-dev-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6390}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sanad-dev-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sanad}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sanad}
    ports:
      - '${RABBITMQ_PORT:-5680}:5672'
      - '${RABBITMQ_MGMT_PORT:-15680}:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sanad-dev-net

  # The SOLE writer of the shared libs/*/dist (see infra/scripts/dev-libs.mjs). Builds every
  # shared lib once, marks itself healthy, then rebuilds only the changed lib on a src edit.
  # Every app/frontend container gates on this being healthy, so nothing imports a missing or
  # half-written dist. It owns its OWN .nx cache volume (it's the only Nx-heavy backend proc).
  libs-builder:
    build:
      context: ..
      dockerfile: infra/docker/libs-builder.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_ENV: development
      NX_DAEMON: 'false'
    volumes:
      - ..:/workspace
      - libsbuilder_node_modules:/workspace/node_modules
      - libsbuilder_nx:/workspace/.nx
    healthcheck:
      # Marker written by dev-libs.mjs after the initial full build completes.
      test: ['CMD-SHELL', 'test -f /workspace/.nx/.libs-ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks:
      - sanad-dev-net

  api-gateway:
    build:
      context: ..
      dockerfile: infra/docker/api-gateway.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      # Connection strings the gateway/services consume from P2 onward.
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
      # The gateway holds only the JWT PUBLIC key — it verifies, identity signs (decision 2).
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    volumes:
      # Bind-mount the whole workspace for hot-reload; keep container-built node_modules.
      - ..:/workspace
      - gateway_node_modules:/workspace/node_modules
    ports:
      - '${GATEWAY_PORT:-3010}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      libs-builder:
        condition: service_healthy
      # Only ordering — the gateway calls services lazily over RMQ (5s timeout), so a single
      # not-yet-ready service must not block the gateway (or, via nginx, the whole edge).
      identity-service:
        condition: service_started
      settings-service:
        condition: service_started
      media-service:
        condition: service_started
      content-service:
        condition: service_started
      notifications-service:
        condition: service_started
    networks:
      - sanad-dev-net

  identity-service:
    build:
      context: ..
      dockerfile: infra/docker/identity-service.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD:-sanad}@postgres:5432/identity
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
      # RS256 keypair (dev throwaway in infra/.env.example) — identity signs + verifies.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sanad.tech}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
    volumes:
      - ..:/workspace
      - identity_node_modules:/workspace/node_modules
    ports:
      - '${IDENTITY_PORT:-3011}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      libs-builder:
        condition: service_healthy
    networks:
      - sanad-dev-net

  settings-service:
    build:
      context: ..
      dockerfile: infra/docker/settings-service.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3002
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD:-sanad}@postgres:5432/settings
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      # AES-256-GCM master key for the integration-secrets vault (N13). Dev throwaway here;
      # a real base64-32-byte key is REQUIRED in staging/prod (OPS1).
      APP_SECRETS_ENCRYPTION_KEY: ${APP_SECRETS_ENCRYPTION_KEY:-c2FuYWQtZGV2LXNlY3JldHMtZW5jcnlwdGlvbi1rZXk=}
      # Env fallback for the SMTP password secret (the vault is the primary source).
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ..:/workspace
      - settings_node_modules:/workspace/node_modules
    ports:
      - '${SETTINGS_PORT:-3012}:3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      libs-builder:
        condition: service_healthy
    networks:
      - sanad-dev-net

  media-service:
    build:
      context: ..
      dockerfile: infra/docker/media-service.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3003
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD:-sanad}@postgres:5432/media
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
      # Cloudflare R2 (S3-compatible). OPTIONAL — the service boots without them and
      # uploads 503 until set. Real values live in gitignored infra/.env.development
      # (the integration-secrets vault replaces this env source later — see PROGRESS).
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # The browser origin(s) the admin SPA uploads from — what the bucket's CORS policy must
      # allow, and what media-service checks/writes (rules change-log 2026-07-20).
      ADMIN_PUBLIC_ORIGINS: ${ADMIN_PUBLIC_ORIGINS:-http://localhost:8190}
    volumes:
      - ..:/workspace
      - media_node_modules:/workspace/node_modules
    ports:
      - '${MEDIA_PORT:-3013}:3003'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      libs-builder:
        condition: service_healthy
    networks:
      - sanad-dev-net

  content-service:
    build:
      context: ..
      dockerfile: infra/docker/content-service.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3004
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD:-sanad}@postgres:5432/content
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
    volumes:
      - ..:/workspace
      - content_node_modules:/workspace/node_modules
    ports:
      - '${CONTENT_PORT:-3014}:3004'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      libs-builder:
        condition: service_healthy
    networks:
      - sanad-dev-net

  notifications-service:
    build:
      context: ..
      dockerfile: infra/docker/notifications-service.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3005
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD:-sanad}@postgres:5432/notifications
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-sanad}:${RABBITMQ_PASSWORD:-sanad}@rabbitmq:5672
      # SMTP transport — OPTIONAL: unset → emails are logged to the console (dev-safe). The
      # SMTP PASSWORD is resolved from the settings-secrets vault (N13); SMTP_PASSWORD here
      # is the env fallback. NOTIFICATIONS_TEAM_EMAIL receives new-lead alerts.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-Sanad Tech <no-reply@sanad.tech>}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATIONS_TEAM_EMAIL: ${NOTIFICATIONS_TEAM_EMAIL:-team@sanad.tech}
      NOTIFICATIONS_TEAM_LOCALE: ${NOTIFICATIONS_TEAM_LOCALE:-ar}
    volumes:
      - ..:/workspace
      - notifications_node_modules:/workspace/node_modules
    ports:
      - '${NOTIFICATIONS_PORT:-3015}:3005'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3005/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      libs-builder:
        condition: service_healthy
    networks:
      - sanad-dev-net

  # First frontend (P7): the Vite admin portal dev server, served under /admin/ by
  # nginx. The browser calls the gateway at the relative /api (resolved against the
  # nginx origin), so this container needs no DB/broker — it only serves the SPA.
  admin-portal:
    build:
      context: ..
      dockerfile: infra/docker/admin-portal.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_ENV: development
      VITE_APP_ENV: development
      # Vite/Next dev still run Nx (their dev plugins); keep the daemon off + an isolated
      # .nx volume so this Nx process never shares state with libs-builder or the host.
      NX_DAEMON: 'false'
    volumes:
      - ..:/workspace
      - admin_node_modules:/workspace/node_modules
      - admin_nx:/workspace/.nx
    ports:
      - '${ADMIN_PORT:-4200}:4200'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4200/admin/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      libs-builder:
        condition: service_healthy
    networks:
      - sanad-dev-net

  # P8 website (Next.js App Router) dev server, served under `/` by nginx. Server components
  # fetch the gateway IN-CLUSTER (http://api-gateway:3000/api) — an RSC fetch has no browser
  # origin, so the base is absolute, not the browser-relative /api the admin SPA uses (U19).
  website:
    build:
      context: ..
      dockerfile: infra/docker/website.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_ENV: development
      NX_DAEMON: 'false'
      GATEWAY_BASE_URL: http://api-gateway:3000/api
    volumes:
      - ..:/workspace
      - website_node_modules:/workspace/node_modules
      - website_nx:/workspace/.nx
    ports:
      - '${WEBSITE_PORT:-3020}:3000'
    healthcheck:
      # `/` returns a fast 308 → /ar once Next is listening; <500 means "server is up"
      # (route compile is lazy, covered by nginx's read timeout — not this liveness probe).
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      libs-builder:
        condition: service_healthy
    networks:
      - sanad-dev-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${NGINX_PORT:-8190}:80'
    depends_on:
      # Gate the edge on the gateway being healthy (the critical path). Frontends are only
      # `service_started` so a slow/broken frontend can't block /api — nginx's request-time
      # resolver + timeouts absorb the brief window before a frontend finishes listening.
      api-gateway:
        condition: service_healthy
      admin-portal:
        condition: service_started
      website:
        condition: service_started
    networks:
      - sanad-dev-net

networks:
  sanad-dev-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  gateway_node_modules:
  identity_node_modules:
  settings_node_modules:
  media_node_modules:
  content_node_modules:
  notifications_node_modules:
  admin_node_modules:
  website_node_modules:
  libsbuilder_node_modules:
  # Isolated .nx state for the only containers that still run Nx (libs-builder + the two
  # frontends' Vite/Next dev plugins) — masks the bind-mounted .nx so these Nx processes
  # never share cache/daemon state with each other or the host.
  libsbuilder_nx:
  admin_nx:
  website_nx:
