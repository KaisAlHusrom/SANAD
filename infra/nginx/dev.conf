# Dev vhost — the single public entry (MS4). Only the api-gateway is exposed now;
# website (P8) and admin (P7) upstreams are reserved as commented stubs below.
#
# Using a Docker DNS `resolver` + a `set` variable means nginx starts even if an
# upstream container is absent (it resolves at request time, not at config load),
# so adding website/admin later won't require this file to change shape.

server {
    listen 80;
    server_name _;

    # nginx listens on :80 inside the container but is published on host :8190. Without
    # this, nginx's implicit trailing-slash redirect (`/admin` → `/admin/`) builds an
    # ABSOLUTE Location with its own port (`http://localhost/admin/` → :80), which the
    # browser follows to a dead port → ERR_CONNECTION_REFUSED. Relative redirects keep
    # the browser on whatever host:port it came in on (:8190).
    absolute_redirect off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Fail fast to an upstream that isn't accepting connections yet (a restarting container)
    # instead of hanging — the container's restart policy + supervisor bring it back in
    # seconds, and the request-time resolver re-resolves the new IP on the next try.
    proxy_connect_timeout 5s;

    # api-gateway keeps its own `/api` global prefix, so the path passes through unchanged.
    location /api/ {
        set $upstream_gateway api-gateway;
        proxy_pass http://$upstream_gateway:3000;

        # Gateway responses are fast (reads cap at a 5s RMQ timeout); 30s is generous margin.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # P7 admin portal — the Vite dev server serves the SPA under /admin/ (Vite
    # `base: '/admin/'`, router basename '/admin'). Path passes through unchanged so
    # Vite's base matches; HMR upgrades over WebSocket.
    location /admin/ {
        set $upstream_admin admin-portal;
        proxy_pass http://$upstream_admin:4200;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- reserved for later phases ---
    # P8 website — the Next.js (App Router) dev server serves the public site at `/`.
    # Longest-prefix match keeps `/api/` + `/admin/` (above) ahead of this fallback. The
    # site redirects `/` → `/ar` (Arabic default) in middleware; HMR upgrades over WebSocket.
    location / {
        set $upstream_website website;
        proxy_pass http://$upstream_website:3000;

        # Next dev compiles routes lazily on first hit — a cold `/ar` (middleware redirect +
        # RSC compile) can exceed nginx's 60s default → the "504 Gateway Time-out" symptom.
        # 75s covers the first compile; steady-state responses are far faster.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        proxy_http_version 1.1;
        # Forward the FULL client host (incl. the dev :8190 port) so Next.js Server Actions'
        # same-origin check passes. Next compares the browser `Origin` (localhost:8190) against
        # `x-forwarded-host`/`host`; plain `$host` DROPS the port → `localhost` ≠ `localhost:8190`
        # → "Invalid Server Actions request" → HTTP 500 on EVERY form submit (contact + request).
        # `$http_host` is the raw client Host (keeps the port); env-agnostic — in staging/prod it
        # forwards the real domain, still matching Origin. (OPS: the P9 prod nginx must do the same.)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
