# Dev vhost — the single public entry (MS4). Only the api-gateway is exposed now;
# website (P8) and admin (P7) upstreams are reserved as commented stubs below.
#
# Using a Docker DNS `resolver` + a `set` variable means nginx starts even if an
# upstream container is absent (it resolves at request time, not at config load),
# so adding website/admin later won't require this file to change shape.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # api-gateway keeps its own `/api` global prefix, so the path passes through unchanged.
    location /api/ {
        set $upstream_gateway api-gateway;
        proxy_pass http://$upstream_gateway:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- reserved for later phases ---
    # location / {
    #     set $upstream_website website;
    #     proxy_pass http://$upstream_website:3000;   # P8 Next.js website
    # }
    # location /admin/ {
    #     set $upstream_admin admin-portal;
    #     proxy_pass http://$upstream_admin:80;       # P7 Vite admin portal
    # }

    location / {
        return 200 "sanad dev nginx: gateway at /api/\n";
        add_header Content-Type text/plain;
    }
}
