# Full verification gate for the Sanad Tech monorepo (U12 / OPS4).
#
# Contract: pushes go straight to `main` and are gated locally by `.husky/pre-push`, which runs
# only `nx affected`. THIS workflow is what still runs the COMPLETE gate over every project. It
# reports; it does not block. `pull_request` is wired up so branch protection can be switched on
# later without editing this file.
#
# `run-many`, not `affected`: pre-push is where completeness is traded for speed, and this is
# where it is bought back — an unconditional guarantee that cannot be lost to a mis-resolved
# base. With the Nx cache restored, unaffected tasks are cache hits, so the cost is close to
# `affected` anyway, and `run-many` self-heals a poisoned cache where `affected` compounds one.
#
# Nx Cloud stays OFF (nx.json `neverConnectToCloud`). Task caching is persisted with actions/cache.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NX_TUI: 'false'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `nx affected` / nrwl/nx-set-shas can be adopted later untouched.
          fetch-depth: 0

      # Must precede setup-node, or `cache: pnpm` cannot locate the store.
      # No `version:` — action-setup reads `packageManager` from package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The key carries the sha so it always misses and always writes a fresh entry;
      # restore-keys supply the nearest previous cache. Safe to reuse across commits ONLY
      # because nx.json `sharedGlobals` makes the lockfile and root tsconfigs task inputs.
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-

      # nx.json sets sync.applyChanges:true, which WRITES TS project references. Run the check
      # form BEFORE any task, so drift fails the job instead of being silently repaired mid-run.
      - name: Check Nx workspace sync
        run: pnpm nx sync:check

      - name: Gate
        run: pnpm nx run-many -t typecheck lint test build --parallel=3 --output-style=stream
