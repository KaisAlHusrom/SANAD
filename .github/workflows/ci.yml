# Full verification gate for the Sanad Tech monorepo (U12 / OPS4).
#
# Contract: pushes go straight to `main` and are gated locally by `.husky/pre-push`, which runs
# only `nx affected`. THIS workflow is what still runs the COMPLETE gate over every project. It
# reports; it does not block. `pull_request` is wired up so branch protection can be switched on
# later without editing this file.
#
# `run-many`, not `affected`: pre-push is where completeness is traded for speed, and this is
# where it is bought back — an unconditional guarantee that cannot be lost to a mis-resolved
# base. With the Nx cache restored, unaffected tasks are cache hits, so the cost is close to
# `affected` anyway, and `run-many` self-heals a poisoned cache where `affected` compounds one.
#
# Nx Cloud stays OFF (nx.json `neverConnectToCloud`). Task caching is persisted with actions/cache.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NX_TUI: 'false'
      NODE_OPTIONS: '--max-old-space-size=4096'
      # The nine `*.int.spec.ts` suites degrade to `describe.skip` when Postgres is unreachable.
      # That is right locally (OPS5 keeps the stack DOWN for the verifier) but it meant they had
      # NEVER run in CI — nine suites reporting green while proving nothing. With the service
      # below provisioned, a skip here is a lie, so make it a hard failure instead (TDD2).
      REQUIRE_DB_TESTS: '1'

    # Matches the dev stack: same credentials, same host port (5440) the int specs hardcode.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad
          POSTGRES_DB: sanad
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `nx affected` / nrwl/nx-set-shas can be adopted later untouched.
          fetch-depth: 0

      # Must precede setup-node, or `cache: pnpm` cannot locate the store.
      # No `version:` — action-setup reads `packageManager` from package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The key carries the sha so it always misses and always writes a fresh entry;
      # restore-keys supply the nearest previous cache. Safe to reuse across commits ONLY
      # because nx.json `sharedGlobals` makes the lockfile and root tsconfigs task inputs.
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-

      # nx.json sets sync.applyChanges:true, which WRITES TS project references. Run the check
      # form BEFORE any task, so drift fails the job instead of being silently repaired mid-run.
      - name: Check Nx workspace sync
        run: pnpm nx sync:check

      # Same script the dev stack's postgres runs on first boot, so CI and dev agree on the
      # database list. `ensureTestDatabase()` also self-heals a missing `*_test`, but creating
      # them up front keeps a suite from being the first thing to discover the gap.
      - name: Create service + test databases
        run: |
          PGPASSWORD=sanad psql -h localhost -p 5440 -U sanad -d sanad \
            -v ON_ERROR_STOP=1 -f infra/postgres/init/01-create-databases.sql
          PGPASSWORD=sanad psql -h localhost -p 5440 -U sanad -d sanad -c '\l'

      - name: Gate
        run: pnpm nx run-many -t typecheck lint test build --parallel=3 --output-style=stream
